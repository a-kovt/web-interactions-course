# All services of the Web project (labs 1-6 and the additional items). From this folder:
#   cp .env.example .env && docker compose up -d --build
# Addresses and ports: README.md; components: docs/ENVIRONMENT.md. Change or replace anything you need.

x-server: &server
  build: ./server
  image: project-web:${APP_TAG:-dev}
  environment: &server-env
    DATABASE_URL: postgresql://app:app@postgres:5432/app
    KAFKA_BOOTSTRAP: broker:9092
    EXTERNAL_URL: http://external-sim:8000
    REDIS_URL: redis://redis:6379/0
    FLAGS_URL: http://flags:8016
    OIDC_ISSUER: http://localhost:8180/realms/project
    OIDC_INTERNAL_URL: http://keycloak:8180/realms/project
    CLIENT_ORIGIN: ${CLIENT_ORIGIN:-http://localhost:8081}
    OTEL_ENABLED: ${OTEL_ENABLED:-off}
    OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
    INVARIANT_MODE: ${INVARIANT_MODE:-protected}
    POOL_SIZE: ${POOL_SIZE:-10}
    RATE_LIMIT_PER_MIN: ${RATE_LIMIT_PER_MIN:-120}
    JWT_REVOCATION: ${JWT_REVOCATION:-on}
    FAULTS: "on"
  depends_on:
    migrate:
      condition: service_completed_successfully
  restart: unless-stopped
  stop_grace_period: 30s
  volumes:
    - faults:/faults

x-after-broker: &after-broker
  migrate:
    condition: service_completed_successfully
  broker-init:
    condition: service_completed_successfully

services:
  postgres:
    image: postgres:17.11
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: app
    command:
      - "postgres"
      - "-c"
      - "max_connections=${PG_MAX_CONNECTIONS:-100}"
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test:
        - "CMD-SHELL"
        - "pg_isready -U app"
      interval: 2s
      retries: 30

  migrate:
    image: postgres:17.11
    command:
      - "sh"
      - "-c"
      - "sh /migrate/migrate.sh $${MIGRATE_TO:+--to $$MIGRATE_TO}"
    environment:
      DATABASE_URL: postgresql://app:app@postgres:5432/app
      MIGRATIONS_DIR: /migrations
      MIGRATE_TO: ${MIGRATE_TO:-}
    volumes:
      - "./configs/migrate:/migrate:ro"
      - "./migrations:/migrations:ro"
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  app-a:
    <<: *server
    environment:
      <<: *server-env
      INSTANCE: app-a
    ports:
      - "${APP_A_PORT:-8001}:8000"
  app-b:
    <<: *server
    environment:
      <<: *server-env
      INSTANCE: app-b
    ports:
      - "${APP_B_PORT:-8002}:8000"
  app-canary:
    <<: *server
    image: project-web:${CANARY_TAG:-dev}
    environment:
      <<: *server-env
      INSTANCE: app-canary

  nginx:
    image: nginx:1.31.7
    command:
      - "sh"
      - "/etc/nginx/start.sh"
    environment:
      CANARY_WEIGHT: "${CANARY_WEIGHT:-0}"
    volumes:
      - ./configs/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./configs/nginx/start.sh:/etc/nginx/start.sh:ro
    ports:
      - "${NGINX_PORT:-8080}:80"
    depends_on:
      - app-a
      - app-b
      - app-canary
      - gateway-a
      - gateway-b
    restart: unless-stopped

  broker:
    image: apache/kafka:4.3.1
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:9094
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://broker:9092,EXTERNAL://localhost:${KAFKA_HOST_PORT:-9094}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@broker:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    ports:
      - "${KAFKA_HOST_PORT:-9094}:9094"
    healthcheck:
      test:
        - "CMD-SHELL"
        - "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"
      interval: 3s
      retries: 40
    restart: unless-stopped
  broker-init:
    image: apache/kafka:4.3.1
    command:
      - "sh"
      - "/scripts/topics.sh"
    environment:
      BOOTSTRAP: broker:9092
      TOPICS: domain-events:3 domain-events.dlq:1 notifications:3
    volumes:
      - "./configs/broker/kafka:/scripts:ro"
    depends_on:
      broker:
        condition: service_healthy
    restart: "no"
  kafka-ui:
    image: kafbat/kafka-ui:v1.5.0
    environment:
      KAFKA_CLUSTERS_0_NAME: web
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: broker:9092
    ports:
      - "${KAFKA_UI_PORT:-8085}:8080"
    depends_on:
      broker:
        condition: service_healthy

  publisher:
    <<: *server
    command:
      - "python"
      - "-m"
      - "app.publisher"
    environment:
      <<: *server-env
      INSTANCE: publisher
    depends_on: *after-broker
  worker:
    <<: *server
    command:
      - "python"
      - "-m"
      - "app.worker"
    environment:
      <<: *server-env
      INSTANCE: worker
      GROUP_ID: worker
    depends_on: *after-broker
  router:
    <<: *server
    command:
      - "python"
      - "-m"
      - "app.router"
    environment:
      <<: *server-env
      INSTANCE: router
      GROUP_ID: router
    depends_on: *after-broker
  gateway-a:
    <<: *server
    command:
      - "uvicorn"
      - "app.gateway:app"
      - "--host"
      - "0.0.0.0"
      - "--port"
      - "8000"
      - "--no-access-log"
    environment:
      <<: *server-env
      INSTANCE: gateway-a
      GROUP_ID: gateway-a
    ports:
      - "${GATEWAY_A_PORT:-8091}:8000"
    depends_on: *after-broker
  gateway-b:
    <<: *server
    command:
      - "uvicorn"
      - "app.gateway:app"
      - "--host"
      - "0.0.0.0"
      - "--port"
      - "8000"
      - "--no-access-log"
    environment:
      <<: *server-env
      INSTANCE: gateway-b
      GROUP_ID: gateway-b
    ports:
      - "${GATEWAY_B_PORT:-8092}:8000"
    depends_on: *after-broker

  external-sim:
    build: ./tools/external-sim
    environment:
      SIM_NAME: ${SIM_NAME:-provider}
      SIM_ROUTE: ${SIM_ROUTE:-/operations}
      SIM_DELAY_MS: ${SIM_DELAY_MS:-1000-8000}
      SIM_REJECT_SHARE: ${SIM_REJECT_SHARE:-0.2}
      SIM_ERROR_SHARE: ${SIM_ERROR_SHARE:-0.05}
      SIM_REJECT_REASONS: ${SIM_REJECT_REASONS:-rejected by the provider}
      SIM_SEED: ${SIM_SEED:-}
      SIM_STATE_FILE: /data/state.jsonl
    volumes:
      - simdata:/data
    ports:
      - "${SIM_PORT:-8090}:8000"
    restart: unless-stopped

  redis:
    image: redis:8.10.2
    ports:
      - "${REDIS_PORT:-6379}:6379"
  keycloak:
    image: quay.io/keycloak/keycloak:26.8.1
    command:
      - "start-dev"
      - "--import-realm"
      - "--http-port=8180"
      - "--hostname=http://localhost:8180"
      - "--hostname-backchannel-dynamic=true"
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
    volumes:
      - ./configs/keycloak:/opt/keycloak/data/import:ro
    ports:
      - "8180:8180"
  flags:
    image: ghcr.io/open-feature/flagd:v0.18.0
    command:
      - "start"
      - "--uri"
      - "file:/etc/flagd/flags.json"
    volumes:
      - ./configs/flags:/etc/flagd:ro
    ports:
      - "${FLAGS_PORT:-8099}:8016"
    restart: unless-stopped

  otel-collector:
    image: otel/opentelemetry-collector:0.163.1
    volumes:
      - ./configs/otel/collector.yaml:/etc/otelcol/config.yaml:ro
  jaeger:
    image: jaegertracing/jaeger:2.22.0
    ports:
      - "${JAEGER_PORT:-16686}:16686"
  prometheus:
    image: prom/prometheus:v3.15.0
    volumes:
      - ./configs/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
  grafana:
    image: grafana/grafana:13.2.4
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - ./configs/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./configs/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "${GRAFANA_PORT:-3000}:3000"

volumes:
  pgdata:
  faults:
  simdata:
