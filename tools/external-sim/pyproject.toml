[project]
name = "external-sim"
version = "1.0.0"
description = "Simulator of a slow external provider for lab 4 of the Web course"
requires-python = ">=3.14"
dependencies = ["fastapi>=0.143", "uvicorn[standard]>=0.54"]

[dependency-groups]
dev = ["ruff>=0.14"]

[tool.uv]
package = false

[tool.ruff]
line-length = 120
target-version = "py314"
