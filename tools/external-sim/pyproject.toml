[project]
name = "external-sim"
version = "1.0.0"
description = "Simulator of a slow external provider for lab 4 of the Web course"
requires-python = ">=3.14"
dependencies = ["fastapi>=0.149.0", "uvicorn[standard]>=0.54.0"]

[dependency-groups]
dev = ["ruff>=0.17.1"]

[tool.uv]
package = false

[tool.ruff]
line-length = 120
target-version = "py314"
