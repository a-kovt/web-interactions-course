# Host :8080 -> nginx :80. "/" -> app-a, app-b (and app-canary by CANARY_WEIGHT);
# "= /v1/ws", "= /v1/sse" -> gateway-a, gateway-b. Upstreams listen on 8000 inside containers.
events { worker_connections 4096; }

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  log_format json escape=json '{"time":"$time_iso8601","request_id":"$req_id","upstream":"$upstream_addr",'
                              '"method":"$request_method","uri":"$uri","status":$status,"rt":$request_time}';
  access_log /dev/stdout json;

  upstream app {
    least_conn;
    server app-a:8000 max_fails=1 fail_timeout=2s;
    server app-b:8000 max_fails=1 fail_timeout=2s;
  }
  upstream canary {
    server app-canary:8000 max_fails=1 fail_timeout=2s;
  }
  upstream gateways {
    least_conn;
    server gateway-a:8000 max_fails=1 fail_timeout=2s;
    server gateway-b:8000 max_fails=1 fail_timeout=2s;
  }

  map $http_x_request_id $req_id { default $http_x_request_id; "" $request_id; }
  map $http_upgrade $connection_upgrade { default upgrade; "" close; }

  # $pool: "app" or "canary", written by start.sh from CANARY_WEIGHT
  include /etc/nginx/generated/*.conf;

  server {
    listen 80;

    # "=": a prefix would also catch POST /v1/ws-tickets, a route of app-a/app-b
    location = /v1/ws {
      proxy_pass http://gateways;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header X-Request-ID $req_id;
      proxy_read_timeout 60s;
      proxy_send_timeout 60s;
    }

    location = /v1/sse {
      proxy_pass http://gateways;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header X-Request-ID $req_id;
      proxy_buffering off;
      proxy_read_timeout 1h;
    }

    location / {
      proxy_pass http://$pool;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header X-Request-ID $req_id;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      add_header X-Pool $pool always;
      # nginx never repeats a POST/PATCH/DELETE that was already sent
      proxy_next_upstream error timeout http_502 http_503;
      proxy_next_upstream_tries 2;
      proxy_connect_timeout 1s;
      proxy_read_timeout 30s;
    }
  }
}
