# D6.4: in Swarm a service name (app, gateway) resolves through the routing mesh to its live
# tasks, so there is one upstream address per service. Docker DNS is asked again every 5 s.
resolver 127.0.0.11 valid=5s;
map $http_upgrade $connection_upgrade { default upgrade; "" close; }

server {
  listen 80;
  set $app http://app:8000;
  set $gateway http://gateway:8000;

  location = /v1/ws {
    proxy_pass $gateway;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_read_timeout 60s;
  }
  location / {
    proxy_pass $app;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_next_upstream error timeout http_502 http_503;
  }
}
