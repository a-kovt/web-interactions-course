# GET /metrics (Prometheus text format) of the instances and gateways; http://localhost:9090/targets
global:
  scrape_interval: 5s
scrape_configs:
  - job_name: app
    static_configs:
      - targets:
          - "app-a:8000"
          - "app-b:8000"
          - "app-canary:8000"
  - job_name: gateway
    static_configs:
      - targets:
          - "gateway-a:8000"
          - "gateway-b:8000"
